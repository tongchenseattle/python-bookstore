name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app-api deps
        run: |
          cd app-api
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run app-api tests
        run: |
          cd app-api
          pytest

  resource-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install resource API deps
        run: |
          cd app-resourceAccess-api
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run resource API tests
        run: |
          cd app-resourceAccess-api
          pytest

  app-ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install app-ui deps
        run: |
          cd app-ui
          npm install
      - name: Lint app-ui
        run: |
          cd app-ui
          npm run lint
